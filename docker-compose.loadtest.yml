# 压测专用覆盖配置：模拟"100 个来自不同 IP 的真实用户"。
# 用法：docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
# 说明：生产默认登录限流 5 次/分/IP 是防暴力破解设计；本机压测所有用户
#       共享同一 IP 会误触发，故压测环境放宽。生产配置不受影响。
services:
  backend:
    environment:
      - RATE_LIMIT_LOGIN_PER_MIN=10000
      - RATE_LIMIT_CHAT_PER_MIN=10000
